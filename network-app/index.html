<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Search Visualization - YaCy / Presearch / SearXNG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000a1e;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Loading screen */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000a1e 0%, #001a3a 50%, #000a1e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 9999;
        }

        .loading h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #4488ff;
            text-shadow: 0 0 20px rgba(68, 136, 255, 0.5);
        }

        .loading p {
            color: #8899aa;
            font-size: 0.9rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(68, 136, 255, 0.2);
            border-top-color: #4488ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Controls panel */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(0, 10, 30, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid rgba(68, 136, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .controls button {
            background: rgba(68, 136, 255, 0.2);
            border: 1px solid rgba(68, 136, 255, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: rgba(68, 136, 255, 0.4);
            border-color: #4488ff;
        }

        .controls button.active {
            background: #4488ff;
            border-color: #4488ff;
        }

        /* Search bar */
        .search-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid rgba(68, 136, 255, 0.5);
            background: rgba(0, 10, 30, 0.9);
            color: white;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(10px);
        }

        .search-bar input:focus {
            border-color: #4488ff;
            box-shadow: 0 0 20px rgba(68, 136, 255, 0.3);
        }

        .search-bar button {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #4488ff, #2266dd);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-bar button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(68, 136, 255, 0.5);
        }

        /* Network type selector */
        .network-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .network-selector button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid rgba(68, 136, 255, 0.3);
            background: rgba(0, 10, 30, 0.9);
            color: white;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: all 0.2s;
        }

        .network-selector button:hover {
            border-color: #4488ff;
            background: rgba(68, 136, 255, 0.2);
        }

        .network-selector button.active {
            border-color: #4488ff;
            background: rgba(68, 136, 255, 0.3);
        }

        /* Status indicator */
        .status {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 10, 30, 0.9);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(68, 136, 255, 0.3);
            color: white;
            font-size: 11px;
            font-family: monospace;
        }

        .status .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status .indicator.online { background: #44ff88; }
        .status .indicator.offline { background: #ff4444; }
        .status .indicator.connecting { background: #ffaa44; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading">
            <div class="spinner"></div>
            <h1>Network Visualization</h1>
            <p>Initialisiere 3D-Netzwerk...</p>
        </div>
    </div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
